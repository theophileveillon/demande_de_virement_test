<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>Demande de virement</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    body {
      font: 16px system-ui;
      max-width: 760px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    label {
      display: block;
      margin: 0.8rem 0;
    }
    input,
    select,
    textarea {
      width: 100%;
      padding: 0.55rem;
      box-sizing: border-box;
    }
    button {
      padding: 0.7rem 1rem;
      margin: 0.5rem 0;
    }
    .hidden {
      display: none;
    }
    .err {
      color: #a00;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.8rem;
    }
  </style>
</head>
<body>
  <h1>Demande de virement</h1>
  <div id="signin"></div>
  <p id="status">Connexion requise.</p>

  <form id="f" class="hidden">
    <label>Description courte
      <input name="description" required>
    </label>

    <label>Type
      <select name="type">
        <option>NDF</option>
        <option>DSH</option>
        <option>FAC</option>
      </select>
    </label>

    <label>Bénéficiaire existant
      <select name="beneficiaryId" id="benef"></select>
    </label>

    <fieldset>
      <legend>Nouveau bénéficiaire (NDF uniquement)</legend>
      <div class="grid">
        <input name="prenom" placeholder="Prénom">
        <input name="nom" placeholder="Nom">
        <input name="email" placeholder="Email">
        <input name="phone" placeholder="Téléphone">
        <input name="role" placeholder="Rôle" value="Membre">
        <input name="iban" placeholder="IBAN">
      </div>
    </fieldset>

    <label>Détail des achats
      <textarea name="ndfTable"></textarea>
    </label>

    <label>Justificatifs
      <textarea name="justificatifs"></textarea>
    </label>

    <label>Première NDF ?
      <input name="firstNdf">
    </label>

    <label>Raison DSH
      <textarea name="reason"></textarea>
    </label>

    <label>Première DSH ?
      <input name="firstDsh">
    </label>

    <label>Prestataire
      <input name="provider">
    </label>

    <label>IBAN prestataire
      <input name="providerIban">
    </label>

    <label>Libellé
      <input name="label">
    </label>

    <label>Facture / référence
      <textarea name="invoicePdf"></textarea>
    </label>

    <button>Envoyer</button>
  </form>

  <p id="msg"></p>

  <script>
    const API = '__APPS_SCRIPT_EXEC_URL__',
      CLIENT_ID = '__GOOGLE_CLIENT_ID__';
    let token = '';
    const $ = x => document.querySelector(x);

    function msg(x, e) {
      $('#msg').textContent = x;
      $('#msg').className = e ? 'err' : '';
    }

    function credential(r) {
      token = r.credential;
      fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ action: 'context', idToken: token })
      })
        .then(x => x.json())
        .then(x => {
          if (!x.ok) throw 0;
          $('#status').textContent = 'Connecté : ' + x.email + ' — clubs : ' + x.clubs.join(', ');
          $('#benef').innerHTML =
            '<option value="">Nouveau bénéficiaire</option>' +
            x.beneficiaires
              .map(b => `<option value="${b.id}">${b.label} — ${b.club}</option>`)
              .join('');
          $('#f').classList.remove('hidden');
        })
        .catch(() => msg('Accès refusé ou erreur de communication.', true));
    }

    window.onload = () => {
      google.accounts.id.initialize({ client_id: CLIENT_ID, callback: credential });
      google.accounts.id.renderButton($('#signin'), {
        theme: 'outline',
        size: 'large'
      });
    };

    $('#f').onsubmit = e => {
      e.preventDefault();
      const fd = new FormData(e.target),
        p = Object.fromEntries(fd.entries());
      p.newBeneficiary = p.beneficiaryId
        ? ''
        : p.prenom
        ? {
            prenom: p.prenom,
            nom: p.nom,
            email: p.email,
            phone: p.phone,
            role: p.role,
            iban: p.iban
          }
        : null;

      fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain' },
        body: JSON.stringify({ action: 'submit', idToken: token, payload: p })
      })
        .then(x => x.json())
        .then(x =>
          x.ok
            ? msg('Demande enregistrée.')
            : msg('Impossible d’enregistrer la demande.', true)
        )
        .catch(() => msg('Erreur de communication.', true));
    };
  </script>
</body>
</html>
